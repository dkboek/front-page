<!DOCTYPE html>

  <meta charset="utf-8">

  <link rel="canonical" href="https://www.danielboek.com/education.html">
  <!-- Link layout stylesheet -->
  <link rel="stylesheet" type="text/css" href="./styles/page_layout.css">

  <style>
    #testBox {
      position: absolute;
      top: 750px;
      left: 700px;
      height: 50px;
      width: 50px;
      background-color: blue;
    }
    #tree:hover path {
      transition: d 2s ease-in-out;
      d: path("M 500 1000 Q 500 150 200 150");
    }
    .tree-grow {
      transition: d 4s ease-in-out;
      d: path("M 500 1000 Q 500 150 200 150");
    }
    .fadeable {
      opacity: 0;
    }
    .fade-in {
      opacity: 1;
      transition: opacity 10s linear;
    }

  </style>

<body>

<nav>
  <ul>

  <div id="external-links">
    <a href="https://github.com/dkboek/front-page.git"><img src="./images/github_icon.png" alt="Github"></a>
  </div>
</nav>

<div id="sidebar">
  <h2>Welcome to TESTING</h2>
  <p id="tagline">We hope you enjoy your TESTING</p>
</div>

<div id="mainbar">
  <h1>Test</h1>

  <svg height="400" width="450">

    <!-- Draw the paths -->
    <path id="lineAB" d="M 100 350 l 150 -300" stroke="red" stroke-width="4"/>
    <path id="lineBC" d="M 250 50 l 150 300" stroke="red" stroke-width="4"/>
    <path id="lineMID" d="M 175 200 l 150 0" stroke="green" stroke-width="4"/>
    <path id="lineAC" d="M 100 350 q 150 -300 300 0" stroke="blue" stroke-width="4" fill="none"/>

    <!-- Mark relevant points -->
    <g stroke="black" stroke-width="3" fill="black">
    <circle id="pointA" cx="100" cy="350" r="4" />
    <circle id="pointB" cx="250" cy="50" r="4" />
    <circle id="pointC" cx="400" cy="350" r="4" />
    </g>

    <!-- Label the points -->
    <g font-size="30" font-family="sans-serif" fill="green" text-anchor="middle">
    <text x="100" y="350" dx="-30">A</text>
    <text x="250" y="50" dy="-10">B</text>
    <text x="400" y="350" dx="30">C</text>
    </g>

    <path d="M750 5 L775 200 L725 150 Z"
    style="fill:green;stroke:green" />

  </svg>

  <div id="testBox" class="fadeable"> test </div>

  <svg height="1000", width="1000" id="tree">
    <circle id="testCircle" class="fadeable" cx="200" cy="150" r="40" stroke="green" stroke-width="4" fill="yellow" />
    <!-- <path id="testPath" d="M 500 1000 Q 500 800 500 600" stroke="green" stroke-width="100" /> -->
    <path id="testPath" d="M 450 1000 L 450 900 Q 450 800 500 600 Q 550 800 550 900 L 550 1000 Z" stroke="green" stroke-width="2" fill="green" />
  </svg>

</div>

</div>
</body>

<script type="module">
  // Find the circle and path elements within the svg object,
  //  to work out appropriate coordinates later
  console.log("TESTING");

  const svgElement = document.getElementById('tree');
  const circleElement = document.getElementById('testCircle');
  const pathElement = document.getElementById('testPath');
  const boxElement = document.getElementById('testBox');

  const clamp = (val, min, max) => Math.min(Math.max(val, min), max);

  const randomInt = (low, high)  => low + Math.floor(Math.random()*(high-low));

  try {

  // Get coords of box and tree base (relative to svg coordinates), to be used for the animation
  const treeMCoords = [450,1000];
  const treeFinalCoords = [550,1000];
  const treeCentreX = treeMCoords[0]/2 + treeFinalCoords[0]/2;
  const svgCoords = [ svgElement.getBoundingClientRect().left + window.scrollX,
                       svgElement.getBoundingClientRect().top + window.scrollY ];
  const svgSize = [ svgElement.getBoundingClientRect().width,
                      svgElement.getBoundingClientRect().height ];
  const boxCoords = [boxElement.offsetLeft - svgCoords[0], boxElement.offsetTop - svgCoords[1]];
  const boxSize = [boxElement.offsetWidth, boxElement.offsetHeight];
  
  const trunkBaseHeight = boxCoords[1] + 
                      (svgSize[1] - boxCoords[1])
                        *clamp(svgSize[0]/(8*Math.abs(boxCoords[0]-treeCentreX)),1/2,2/3);

  // We choose random animation durations for the two growing phases, in ms
  const branchAnimDuration = randomInt(3000,5000);
  const trunkAnimDuration = randomInt(3000,5000);


  // Locate the box within the svg coordinates
  const branchQ1FinalCoords = [boxCoords[0] + boxSize[0]/2, boxCoords[1] + boxSize[1]/2];
  const branchQ2FinalCoords = [treeFinalCoords[0], trunkBaseHeight];

  // Define the curve of the branch
  const branchQOffset = clamp( 3*svgSize[1]/10 - Math.abs(boxCoords[0]-treeCentreX),
                         svgSize[1]/20, 3*svgSize[1]/10)
  
  const branchQ1MiddleCoords = [treeMCoords[0], branchQ1FinalCoords[1] + branchQOffset];
  const branchQ2MiddleCoords = [treeFinalCoords[0], branchQ1FinalCoords[1] + branchQOffset];

  // Define the linear extent of the trunk
  const branchL1Coords = [treeMCoords[0], trunkBaseHeight];
  const branchL2Coords = [branchQ2FinalCoords[0], treeFinalCoords[1]]

  // Define the 'd' string to be used for the tree
  const branchAnimString = "path('M " + Math.floor(treeMCoords[0]) + " " + Math.floor(treeMCoords[1]) + 
      " L " + Math.floor(branchL1Coords[0]) + " " + Math.floor(branchL1Coords[1]) +
      " Q " + Math.floor(branchQ1MiddleCoords[0]) + " " + Math.floor(branchQ1MiddleCoords[1]) + " " +
      Math.floor(branchQ1FinalCoords[0]) + " " + Math.floor(branchQ1FinalCoords[1]) + 
      " Q " + Math.floor(branchQ2MiddleCoords[0]) + " " + Math.floor(branchQ2MiddleCoords[1]) + " " +
      Math.floor(branchQ2FinalCoords[0]) + " " + Math.floor(branchQ2FinalCoords[1]) + 
      " L " + Math.floor(branchL2Coords[0]) + " " + Math.floor(branchL2Coords[1]) + " Z')";

  // Create a new CSS class, which describes the animation for the branch
  const branchAnimStyle = document.createElementNS("http://www.w3.org/2000/svg", "style");
  branchAnimStyle.textContent = ".tree-animation-branch { transition: d " + branchAnimDuration/1000 + "s ease-out; d: " + branchAnimString + "; }";
  document.getElementsByTagName('head')[0].appendChild(branchAnimStyle);


  // We also define an intermediary 'trunk' stage, to improve the 'growing' look of the tree
  const transitionTrunkHeight = svgSize[1]/10;
  const spikeHeight = 3*svgSize[1]/10;
  const trunkL1Coords = [branchL1Coords[0], branchL1Coords[1] + transitionTrunkHeight];
  const trunkL2Coords = branchL2Coords;

  const trunkQ1MiddleCoords = [treeMCoords[0], branchL1Coords[1]];
  const trunkQ1FinalCoords = [clamp(boxCoords[0] + boxSize[0]/2,treeMCoords[0],treeFinalCoords[0]), branchL1Coords[1] - spikeHeight];

  const trunkQ2MiddleCoords = [treeFinalCoords[0], branchL1Coords[1]];
  const trunkQ2FinalCoords = [treeFinalCoords[0], branchL1Coords[1] + transitionTrunkHeight];

  const trunkAnimString = "path('M " + Math.floor(treeMCoords[0]) + " " + Math.floor(treeMCoords[1]) +
      " L " + Math.floor(trunkL1Coords[0]) + " " + Math.floor(trunkL1Coords[1]) +
      " Q " + Math.floor(trunkQ1MiddleCoords[0]) + " " + Math.floor(trunkQ1MiddleCoords[1]) + " " +
      Math.floor(trunkQ1FinalCoords[0]) + " " + Math.floor(trunkQ1FinalCoords[1]) +
      " Q " + Math.floor(trunkQ2MiddleCoords[0]) + " " + Math.floor(trunkQ2MiddleCoords[1]) + " " +
      Math.floor(trunkQ2FinalCoords[0]) + " " + Math.floor(trunkQ2FinalCoords[1]) +
      " L " + Math.floor(trunkL2Coords[0]) + " " + Math.floor(trunkL2Coords[1]) + " Z')";

  const trunkAnimStyle = document.createElementNS("http://www.w3.org/2000/svg", "style");
  trunkAnimStyle.textContent = ".tree-animation-trunk { transition: d " + trunkAnimDuration/1000 + "s ease-in; d: " + trunkAnimString + "; }";
  document.getElementsByTagName('head')[0].appendChild(trunkAnimStyle);

  boxElement.className += ' fade-in';

  circleElement.setAttribute("class","fadeable fade-in");

  // Perform the trunk animation, then the branch animation after a delay
  pathElement.className.baseVal = 'tree-animation-trunk';
  const triggerRepaint = pathElement.offsetHeight;
  // pathElement.setAttribute('class', 'tree-animation-trunk');
  setTimeout(() => {
    pathElement.className.baseVal = 'tree-animation-branch';
    // pathElement.setAttribute('class', 'tree-animation-branch');
  },  trunkAnimDuration);

  } catch (err) {
    // Debugging for devices without a dev console (i.e. mobile safari)
    boxElement.innerText = err;
    throw err;
  }
  
</script>


</html>
