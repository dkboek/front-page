<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Education</title>

  <link rel="canonical" href="https://www.danielboek.com/education.html">
  <!-- Link layout stylesheet -->
  <link rel="stylesheet" type="text/css" href="./styles/page_layout.css">

  <style>
    #testBox {
      position: absolute;
      top: 750px;
      left: 170px;
      height: 50px;
      width: 50px;
      background-color: blue;
    }
    #tree:hover path {
      transition: d 2s ease-in-out;
      d: path("M 500 1000 Q 500 150 200 150");
    }
    .tree-grow {
      transition: d 4s ease-in-out;
      d: path("M 500 1000 Q 500 150 200 150");
    }
    .fadeable {
      opacity: 0;
    }
    .fade-in {
      opacity: 1;
      transition: opacity 10s linear;
    }

  </style>
</head>

<body>
<div id="layout">

<nav>
  <ul>
    <li><a href="./index.html" id="home">Home</a></li>
    <li><a href="./resume.html" id="resume">Resume</a></li>
    <li><a href="./proverbs.html" id="proverbs">Proverbs</a></li>
  </ul>
  <div id="external-links">
    <a href="https://github.com/dkboek/front-page.git"><img src="./images/github_icon.png" alt="Github"></a>
  </div>
</nav>

<div id="sidebar">
  <h2>Welcome to TESTING</h2>
  <p id="tagline">We hope you enjoy your TESTING</p>
</div>

<div id="mainbar">
  <h1>Test</h1>

  <svg height="400" width="450">

    <!-- Draw the paths -->
    <path id="lineAB" d="M 100 350 l 150 -300" stroke="red" stroke-width="4"/>
    <path id="lineBC" d="M 250 50 l 150 300" stroke="red" stroke-width="4"/>
    <path id="lineMID" d="M 175 200 l 150 0" stroke="green" stroke-width="4"/>
    <path id="lineAC" d="M 100 350 q 150 -300 300 0" stroke="blue" stroke-width="4" fill="none"/>

    <!-- Mark relevant points -->
    <g stroke="black" stroke-width="3" fill="black">
    <circle id="pointA" cx="100" cy="350" r="4" />
    <circle id="pointB" cx="250" cy="50" r="4" />
    <circle id="pointC" cx="400" cy="350" r="4" />
    </g>

    <!-- Label the points -->
    <g font-size="30" font-family="sans-serif" fill="green" text-anchor="middle">
    <text x="100" y="350" dx="-30">A</text>
    <text x="250" y="50" dy="-10">B</text>
    <text x="400" y="350" dx="30">C</text>
    </g>

    <path d="M750 5 L775 200 L725 150 Z"
    style="fill:green;stroke:green" />

  </svg>

  <div id="testBox" class="fadeable"> test </div>

  <svg height="1000", width="1000" id="tree">
    <circle id="testCircle" class="fadeable" cx="200" cy="150" r="40" stroke="green" stroke-width="4" fill="yellow" />
    <path id="testPath" d="M 500 1000 Q 500 800 500 600" stroke="green" stroke-width="100">
      <animate 
        />
    </path>
  </svg>

</div>

</div>
</body>

<script type="module">
  // Find the circle and path elements within the svg object,
  //  to work out appropriate coordinates later
  console.log("TESTING");
  const svgElement = document.getElementById('tree');
  const circleElement = document.getElementById('testCircle');
  const pathElement = document.getElementById('testPath');
  const boxElement = document.getElementById('testBox');


  // Get coords of box and tree base, to be used for the animation
  const treeMCoords = [500,1000];
  const svgCoords = [ svgElement.getBoundingClientRect()["x"], svgElement.getBoundingClientRect()["y"] ];
  const boxCoords = [boxElement.offsetLeft, boxElement.offsetTop];
  const boxSize = [boxElement.offsetWidth, boxElement.offsetHeight];

  // Locate the box within the svg coordinates
  const treeQFinalCoords = [boxCoords[0] - svgCoords[0] + boxSize[0]/2, boxCoords[1] - svgCoords[1] + boxSize[1]/2];
  const treeQMiddleCoords = [treeMCoords[0], treeQFinalCoords[1]];

  // Define the 'd' string to be used for the tree
  const pathString = "path('M " + treeMCoords[0] + " " + treeMCoords[1] + 
      " Q " + treeQMiddleCoords[0] + " " + treeQMiddleCoords[1] + " " +
      treeQFinalCoords[0] + " " + treeQFinalCoords[1] + "')" ;


  // Create a new class, which describes the animation for the tree
  const styleElement = document.createElementNS("http://www.w3.org/2000/svg", "style");
  styleElement.textContent = ".tree-animation { transition: d 4s ease-in-out; d: " + pathString + "; }";
  document.getElementsByTagName('head')[0].appendChild(styleElement);

  boxElement.className += ' fade-in';

  circleElement.setAttribute("class","fadeable fade-in");

  pathElement.setAttribute('class', 'tree-animation');
  



</script>


</html>
